          command: |
            cat -b /tmp/tier3/61f1111f6 2>/dev/null | head -3 | wc -c || true
      - run:
          name: Retrieve project
          command: git clone --quiet --filter=blob:none https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Pull static data
